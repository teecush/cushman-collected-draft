<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CushBot</title>
    <meta name="description" content="A standalone CushBot test page.">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Rubik:wght@400;700;900&display=swap">
    <link rel="stylesheet" href="./styles.css?v=1">
  </head>
  <body>
    <main class="chat-shell">
      <header class="chat-header">
        <h1>CushBot</h1>
      </header>
      <section class="chat-panel" aria-label="CushBot conversation">
        <div class="chat-transcript" id="transcript" aria-live="polite"></div>
        <div class="chat-suggestions" id="suggestions"></div>
        <form class="chat-form" id="chatForm">
          <label class="chat-input">
            <span>Question</span>
            <textarea id="questionInput" rows="2" placeholder="Ask about Hamlet, Stratford, Shaw, The Wire, a performer, or a venue"></textarea>
          </label>
          <button type="submit">Ask</button>
        </form>
      </section>
    </main>
    <script src="./app.js?v=1" type="module"></script>
  </body>
</html>
